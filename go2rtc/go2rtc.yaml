api:
  listen: ":1984"

rtsp:
  listen: ":8554"
  default_query: "video&audio"

webrtc:
  listen: ":8555"
  candidates:
    - YOUR_HAOS_HOST_IP:8555

log:
  level: info
  ffmpeg: error

ffmpeg:
  h264: "-c:v libx264 -g:v 8 -bf:v 0 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"

streams:
  camera_YOUR_CAMERA_UID:
    - http://127.0.0.1:8085/cam/YOUR_CAMERA_UID
    - ffmpeg:http://127.0.0.1:8085/audio/YOUR_CAMERA_UID#audio=aac#audio=opus#async
    - ffmpeg:camera_YOUR_CAMERA_UID#video=h264
